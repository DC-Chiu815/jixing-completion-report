
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歷屆吉星高照圓滿回報</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:24px 14px;
  font-family:"Noto Sans TC",sans-serif;
  background:#f6f1e7;color:#493a2c;
}
.container{
  max-width:520px;margin:auto;
  background:#fffdf8;border:1px solid #d8c49b;
  border-radius:18px;padding:26px 22px;
  box-shadow:0 5px 20px #8c765022;
}
h1{text-align:center;color:#8a652e;font-size:25px}
.subtitle{text-align:center;color:#9a8056;margin-bottom:25px}
.intro{line-height:1.9}
label{display:block;margin:17px 0 7px;font-weight:bold}
input,textarea,select{
  width:100%;padding:13px;
  border:1px solid #d8c9aa;border-radius:9px;
  background:#fff;font-size:16px;
}
textarea{min-height:90px;resize:vertical}
.unit-field{
  display:flex;align-items:center;gap:10px;
}
.unit-field input{flex:1;min-width:0}
.unit-field span{
  font-size:18px;font-weight:bold;color:#8a652e;
}
button{
  width:100%;margin-top:25px;padding:15px;
  border:0;border-radius:10px;
  background:#96733c;color:white;
  font-size:17px;font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.55;cursor:not-allowed}
.note{text-align:center;font-size:13px;color:#98876e;margin-top:18px}
#status{
  text-align:center;margin-top:15px;
  line-height:1.9;white-space:pre-line;
}
#successBox{
  display:none;text-align:center;
  line-height:2;padding:25px 10px;
}
#successBox h2{color:#8a652e}
#backBtn{display:none;text-decoration:none}
</style>
</head>

<body>
<div class="container">

<h1>吉星高照・圓滿回報</h1>
<div class="subtitle">地藏菩薩聖號法供養</div>

<form id="reportForm">

<p class="intro">
當家師父吉祥：<br>
弟子回報以下法供養功課已圓滿。
</p>

<label>🔸 活動名稱</label>
<select id="activity">
<option value="">請選擇活動（可不填）</option>
<option value="吉星高照">吉星高照</option>
<option value="蓮花宴">蓮花宴</option>
<option value="不確定">不確定</option>
</select>

<label>🔸 持誦者（必填）</label>
<input id="holder" required placeholder="請填寫姓名">

<label>🔸 法供養功德名單</label>
<textarea id="donors" placeholder="請填寫功德名單（可不填）"></textarea>

<label>🔸 編號</label>
<input id="number" placeholder="請自行填寫編號（可不填）">

<label>🔸 地藏聖號數量（必填）</label>
<div class="unit-field">
<input id="chant" type="number" min="0" step="any" required placeholder="請填寫數字">
<span>萬</span>
</div>

<label>🔸 滅定業真言數量（必填）</label>
<div class="unit-field">
<input id="mantra" type="number" min="0" step="any" required placeholder="請填寫數字">
<span>萬</span>
</div>

<p class="intro">
以上聖號／咒語皆未迴向，懇請師父銷編號。<br>
感恩當家師父慈悲加持。<br><br>
懺悔弟子虔誠頂禮。
</p>

<button id="sendBtn" type="submit" disabled>
正在連接 LINE...
</button>

</form>

<div id="status">正在確認 LINE 身分…</div>

<div id="successBox">
<h2>🙏 回報圓滿！</h2>
<p>
感恩師父慈悲加持。<br>
祝福您所求滿願，阿彌陀佛。
</p>

<a id="backBtn" href="https://lin.ee/6bhrLz7" target="_blank" rel="noopener">
<button type="button">返回 LINE 官方帳號</button>
</a>
</div>

<div class="note">南無大願地藏王菩薩 🙏</div>
</div>

<script>
const LIFF_ID = "2012783758-KQ6SJbXI";

const form = document.getElementById("reportForm");
const sendBtn = document.getElementById("sendBtn");
const statusBox = document.getElementById("status");
const successBox = document.getElementById("successBox");
const backBtn = document.getElementById("backBtn");

let liffReady = false;

async function initializeLIFF(){
  try {
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isInClient()) {
      statusBox.textContent = "請使用 LINE 開啟本回報網頁。";
      return;
    }

    if (!liff.isLoggedIn()) {
      statusBox.textContent = "請先登入 LINE，再重新開啟回報網頁。";
      return;
    }

    const context = liff.getContext();

    if (!context || !["utou","group","room"].includes(context.type)) {
      statusBox.textContent =
        "請從與官方帳號的聊天室內開啟本網頁。";
      return;
    }

    liffReady = true;
    sendBtn.disabled = false;
    sendBtn.textContent = "發送圓滿回報";
    statusBox.textContent = "LINE 已連線，可以填寫回報。";

  } catch (error) {
    console.error(error);
    statusBox.textContent = "LINE 連線失敗，請重新開啟網頁。";
  }
}

form.addEventListener("submit", async function(e){
  e.preventDefault();

  if (!liffReady) {
    alert("LINE 尚未連線，請重新開啟網頁。");
    return;
  }

  const activity = document.getElementById("activity").value.trim();
  const holder = document.getElementById("holder").value.trim();
  const donors = document.getElementById("donors").value.trim();
  const number = document.getElementById("number").value.trim();
  const chant = document.getElementById("chant").value.trim();
  const mantra = document.getElementById("mantra").value.trim();

  if (!holder || chant === "" || mantra === "") {
    alert("請填寫必填資料：持誦者、地藏聖號數量及滅定業真言數量。");
    return;
  }

  if (Number(chant) < 0 || Number(mantra) < 0 ||
      !Number.isFinite(Number(chant)) ||
      !Number.isFinite(Number(mantra))) {
    alert("聖號及真言數量請填寫有效的非負數字。");
    return;
  }

  const lines = [
    "當家師父吉祥：",
    "",
    "弟子回報以下法供養功課已圓滿。",
    ""
  ];

  if (activity) lines.push("🔸活動名稱：" + activity);
  lines.push("🔸持誦者：" + holder);
  if (donors) lines.push("🔸法供養功德名單：" + donors);
  if (number) lines.push("🔸編號：" + number);

  lines.push("🔸地藏聖號數量：" + chant + "萬");
  lines.push("🔸滅定業真言數量：" + mantra + "萬");
  lines.push("");
  lines.push("以上聖號／咒語皆未迴向，懇請師父銷編號。");
  lines.push("感恩當家師父慈悲加持。");
  lines.push("");
  lines.push("懺悔弟子虔誠頂禮");

  const message = lines.join("\n");

  if (message.length > 5000) {
    alert("回報內容過長，請縮短後再發送。");
    return;
  }

  if (!confirm("請確認資料正確，確定發送給目前的 LINE 聊天室嗎？")) {
    return;
  }

  sendBtn.disabled = true;
  sendBtn.textContent = "正在發送...";
  statusBox.textContent = "請稍候，正在傳送回報…";

  try {
    await liff.sendMessages([
      { type: "text", text: message }
    ]);

    form.style.display = "none";
    statusBox.style.display = "none";
    successBox.style.display = "block";
    backBtn.style.display = "block";

  } catch (error) {
    console.error(error);
    statusBox.textContent =
      "發送失敗，請確認從 LINE 聊天室開啟，並重新嘗試。";
    sendBtn.disabled = false;
    sendBtn.textContent = "重新發送";
    alert("發送失敗：" + (error.message || "請重新開啟 LINE 網頁"));
  }
});

initializeLIFF();
</script>
</body>
</html>
